<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vejo por Você</title>
<link rel="stylesheet" href="css/estilos.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
</head>
<body>

<!-- HOME -->
<section id="home" class="tela ativa" aria-label="Tela inicial" tabindex="-1">
  <h1>Vejo por Você</h1>
  <p class="sub">Ajuda visual ao vivo, na hora que você precisar.</p>
  <div class="botoes">
    <button id="btnUsuario" class="btn-primario" aria-label="Preciso de ajuda. Toque para chamar um voluntário por vídeo.">
      Preciso de ajuda
    </button>
    <button id="btnVoluntario" class="btn-secundario" aria-label="Sou voluntário. Toque para entrar de plantão e atender chamadas.">
      Sou voluntário
    </button>
  </div>
  <p class="rodape">MVP de teste. Sem cadastro.</p>
</section>

<!-- USUÁRIO -->
<section id="usuario" class="tela" aria-label="Chamada de ajuda" tabindex="-1">
  <div id="statusUsuario" class="status" aria-live="assertive">Preparando a câmera...</div>
  <p id="statusTela" class="status oculto" aria-live="assertive"></p>
  <p id="indicadorTela" class="indicador oculto" role="status">Sua tela está sendo compartilhada agora.</p>
  <video id="videoLocal" autoplay muted playsinline class="oculto"></video>
  <audio id="audioRemotoUsuario" autoplay></audio>
  <div class="botoes">
    <button id="btnAceitarTela" class="btn-primario oculto" aria-label="Mostrar a tela. Toque para aceitar o compartilhamento da tela.">Mostrar a tela</button>
    <button id="btnRecusarTela" class="btn-secundario oculto" aria-label="Não agora. Toque para recusar o compartilhamento da tela.">Não agora</button>
    <button id="btnPararTela" class="btn-perigo oculto" aria-label="Parar de compartilhar a tela. Toque para parar agora.">Parar compartilhamento</button>
    <button id="btnEncerrarUsuario" class="btn-perigo" aria-label="Encerrar chamada">Encerrar</button>
  </div>
</section>

<!-- VOLUNTÁRIO -->
<section id="voluntario" class="tela" aria-label="Painel do voluntário" tabindex="-1">
  <div id="statusVoluntario" class="status" aria-live="assertive">Conectando ao plantão...</div>
  <p id="statusTelaVol" class="status oculto" aria-live="assertive"></p>
  <video id="videoRemoto" autoplay playsinline muted class="oculto"></video>
  <audio id="audioRemotoVol" autoplay class="oculto"></audio>
  <div class="botoes">
    <button id="btnMutar" class="btn-secundario oculto" aria-label="Mutar meu microfone" aria-pressed="false">Mutar microfone</button>
    <button id="btnPedirTela" class="btn-secundario oculto" aria-label="Pedir para ver a tela da pessoa">Pedir para ver a tela</button>
    <button id="btnPararVerTela" class="btn-secundario oculto" aria-label="Parar de ver a tela">Parar de ver a tela</button>
    <button id="btnEncerrarVoluntario" class="btn-perigo oculto" aria-label="Encerrar chamada">Encerrar chamada</button>
    <button id="btnSairPlantao" class="btn-secundario" aria-label="Sair do plantão e voltar ao início">Sair do plantão</button>
  </div>
</section>

<script src="js/nucleo.js"></script>
<script src="js/app.js"></script>
</body>
</html>
